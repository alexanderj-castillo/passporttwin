name: EXP-06 AASX tool
on:
  pull_request:
    paths: ['experiments/aasx/**', 'experiments/aasx_v2.py', 'experiments/run_aasx_exp06.py', 'experiments/tests/test_exp06_aasx.py', 'backend/app/services/aas_builder.py', '.github/workflows/aasx.yml']
  workflow_dispatch:
jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip==24.0
      - run: python -m pip install -r experiments/aasx/requirements.txt
      - run: python -m pytest experiments/tests/test_exp06_aasx.py -q
        env:
          PYTHONPATH: backend:experiments
